# APENAS para desenvolvimento local, NÃO usar com portas ou segredos públicos.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: financeiro_dev_only
      POSTGRES_DB: financeiro
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro -d financeiro"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_dev:/data
    command: ["redis-server", "--appendonly", "yes"]
  minio:
    image: minio/minio:latest # Somente dev. Fixar digest homologado no deploy.
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: financeiro_dev
      MINIO_ROOT_PASSWORD: troque_em_producao
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_dev:/data
volumes:
  postgres_dev:
  redis_dev:
  minio_dev:
